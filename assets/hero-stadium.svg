<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Stylised night stadium with floodlights and a glowing pitch" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#070b18"/>
      <stop offset="0.55" stop-color="#0b1426"/>
      <stop offset="1" stop-color="#0c1a2e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.18" r="0.7">
      <stop offset="0" stop-color="#1f3a5f" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#0b1426" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfe3ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#bfe3ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#138a57"/>
      <stop offset="1" stop-color="#0a5f3c"/>
    </linearGradient>
    <radialGradient id="pitchglow" cx="0.5" cy="0.6" r="0.65">
      <stop offset="0" stop-color="#2bd684" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#2bd684" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#sky)"/>
  <rect width="1200" height="800" fill="url(#glow)"/>

  <!-- stars -->
  <g fill="#cfe4ff">
    <circle cx="120" cy="90" r="1.5" opacity="0.7"/>
    <circle cx="320" cy="60" r="1" opacity="0.5"/>
    <circle cx="520" cy="110" r="1.6" opacity="0.6"/>
    <circle cx="760" cy="70" r="1" opacity="0.5"/>
    <circle cx="980" cy="120" r="1.5" opacity="0.7"/>
    <circle cx="1080" cy="60" r="1" opacity="0.5"/>
    <circle cx="200" cy="160" r="1" opacity="0.4"/>
    <circle cx="880" cy="170" r="1.2" opacity="0.5"/>
  </g>

  <!-- floodlight beams -->
  <g>
    <polygon points="150,150 90,150 -120,560 360,560" fill="url(#beam)" opacity="0.5"/>
    <polygon points="1050,150 1110,150 1320,560 840,560" fill="url(#beam)" opacity="0.5"/>
    <polygon points="430,120 360,120 230,520 640,520" fill="url(#beam)" opacity="0.32"/>
    <polygon points="770,120 840,120 970,520 560,520" fill="url(#beam)" opacity="0.32"/>
  </g>

  <!-- stadium bowl -->
  <path d="M0 560 C300 430 900 430 1200 560 L1200 800 L0 800 Z" fill="#0e1c33"/>
  <path d="M60 545 C330 430 870 430 1140 545" fill="none" stroke="#1c3556" stroke-width="14" opacity="0.6"/>
  <path d="M30 560 C320 425 880 425 1170 560" fill="none" stroke="#16294a" stroke-width="26" opacity="0.5"/>

  <!-- crowd speckle -->
  <g opacity="0.5">
    <g fill="#3a5e8c">
      <circle cx="160" cy="505" r="2"/><circle cx="220" cy="498" r="2"/><circle cx="280" cy="492" r="2"/>
      <circle cx="360" cy="486" r="2"/><circle cx="440" cy="482" r="2"/><circle cx="520" cy="480" r="2"/>
      <circle cx="600" cy="479" r="2"/><circle cx="680" cy="480" r="2"/><circle cx="760" cy="482" r="2"/>
      <circle cx="840" cy="486" r="2"/><circle cx="920" cy="492" r="2"/><circle cx="1000" cy="500" r="2"/>
    </g>
    <g fill="#f5c451">
      <circle cx="300" cy="500" r="2"/><circle cx="500" cy="488" r="2"/><circle cx="700" cy="489" r="2"/><circle cx="900" cy="500" r="2"/>
    </g>
  </g>

  <!-- floodlight rigs -->
  <g fill="#0a1424" stroke="#26405f" stroke-width="3">
    <rect x="120" y="120" width="10" height="60"/>
    <rect x="1070" y="120" width="10" height="60"/>
  </g>
  <g fill="#dff0ff">
    <g>
      <rect x="96" y="96" width="58" height="30" rx="4" fill="#13243e" stroke="#3a5e8c" stroke-width="2"/>
      <circle cx="108" cy="106" r="3.5"/><circle cx="122" cy="106" r="3.5"/><circle cx="136" cy="106" r="3.5"/><circle cx="150" cy="106" r="3.5"/>
      <circle cx="108" cy="118" r="3.5"/><circle cx="122" cy="118" r="3.5"/><circle cx="136" cy="118" r="3.5"/><circle cx="150" cy="118" r="3.5"/>
    </g>
    <g>
      <rect x="1046" y="96" width="58" height="30" rx="4" fill="#13243e" stroke="#3a5e8c" stroke-width="2"/>
      <circle cx="1058" cy="106" r="3.5"/><circle cx="1072" cy="106" r="3.5"/><circle cx="1086" cy="106" r="3.5"/><circle cx="1100" cy="106" r="3.5"/>
      <circle cx="1058" cy="118" r="3.5"/><circle cx="1072" cy="118" r="3.5"/><circle cx="1086" cy="118" r="3.5"/><circle cx="1100" cy="118" r="3.5"/>
    </g>
  </g>

  <!-- pitch (perspective) -->
  <path d="M250 560 L950 560 L1180 800 L20 800 Z" fill="url(#grass)"/>
  <path d="M250 560 L950 560 L1180 800 L20 800 Z" fill="url(#pitchglow)"/>
  <!-- mowing stripes -->
  <g opacity="0.12" fill="#ffffff">
    <path d="M250 560 L320 560 L300 800 L120 800 Z"/>
    <path d="M390 560 L460 560 L560 800 L380 800 Z"/>
    <path d="M530 560 L600 560 L820 800 L640 800 Z"/>
    <path d="M670 560 L740 560 L1080 800 L900 800 Z"/>
  </g>
  <!-- pitch markings -->
  <g fill="none" stroke="#eafff5" stroke-width="3" opacity="0.85">
    <path d="M250 560 L950 560 L1180 800 L20 800 Z"/>
    <line x1="600" y1="560" x2="600" y2="800"/>
    <ellipse cx="600" cy="660" rx="120" ry="46"/>
    <circle cx="600" cy="660" r="4" fill="#eafff5"/>
  </g>

</svg>
